syntax = "proto3";

option csharp_namespace = "OneDevice.PowerSupply.Basic.gRPC";

package powersupply;

// The PowerSupply service definition
service PowerSupplyService {
  // Device management
  rpc ConnectDevice (ConnectDeviceRequest) returns (ConnectDeviceResponse);
  rpc DisconnectDevice (DisconnectDeviceRequest) returns (DisconnectDeviceResponse);
  rpc GetDeviceStatus (GetDeviceStatusRequest) returns (GetDeviceStatusResponse);

  // Channel operations
  rpc SetVolts (SetVoltsRequest) returns (SetVoltsResponse);
  rpc SetAmps (SetAmpsRequest) returns (SetAmpsResponse);
  rpc SetControlMode (SetControlModeRequest) returns (SetControlModeResponse);

  // Device operations
  rpc AllChannelsOn (AllChannelsOnRequest) returns (AllChannelsOnResponse);
  rpc AllChannelsOff (AllChannelsOffRequest) returns (AllChannelsOffResponse);

  // Process data streaming
  rpc StreamProcessData (StreamProcessDataRequest) returns (stream ProcessDataUpdate);

  // Channel info
  rpc GetChannelParameters (GetChannelParametersRequest) returns (GetChannelParametersResponse);
  rpc GetDeviceParameters (GetDeviceParametersRequest) returns (GetDeviceParametersResponse);
}

// Connect device
message ConnectDeviceRequest {
  string device_name = 1;
  string product_type = 2;
  string port_name = 3;
}

message ConnectDeviceResponse {
  bool success = 1;
  string message = 2;
  string device_id = 3;
}

// Disconnect device
message DisconnectDeviceRequest {
  string device_id = 1;
}

message DisconnectDeviceResponse {
  bool success = 1;
  string message = 2;
}

// Get device status
message GetDeviceStatusRequest {
  string device_id = 1;
}

message GetDeviceStatusResponse {
  bool is_connected = 1;
  int32 number_of_channels = 2;
  DeviceParameters device_parameters = 3;
}

// Set volts
message SetVoltsRequest {
  string device_id = 1;
  int32 channel_number = 2;
  double volts = 3;
}

message SetVoltsResponse {
  int32 result = 1;
  string message = 2;
}

// Set amps
message SetAmpsRequest {
  string device_id = 1;
  int32 channel_number = 2;
  double amps = 3;
}

message SetAmpsResponse {
  int32 result = 1;
  string message = 2;
}

// Set control mode
message SetControlModeRequest {
  string device_id = 1;
  int32 channel_number = 2;
  ControlMode mode = 3;
}

message SetControlModeResponse {
  bool success = 1;
  string message = 2;
}

// All channels on
message AllChannelsOnRequest {
  string device_id = 1;
}

message AllChannelsOnResponse {
  int32 result = 1;
  string message = 2;
}

// All channels off
message AllChannelsOffRequest {
  string device_id = 1;
}

message AllChannelsOffResponse {
  int32 result = 1;
  string message = 2;
}

// Stream process data
message StreamProcessDataRequest {
  string device_id = 1;
  int32 channel_number = 2; // -1 for all channels
}

message ProcessDataUpdate {
  int32 channel_number = 1;
  double current_volts = 2;
  double current_amps = 3;
  int64 timestamp = 4;
}

// Get channel parameters
message GetChannelParametersRequest {
  string device_id = 1;
  int32 channel_number = 2;
}

message GetChannelParametersResponse {
  ChannelParameters parameters = 1;
}

message ChannelParameters {
  string name = 1;
  double desired_volts = 2;
  double desired_amps = 3;
  ControlMode control_mode = 4;
}

// Get device parameters
message GetDeviceParametersRequest {
  string device_id = 1;
}

message GetDeviceParametersResponse {
  DeviceParameters parameters = 1;
}

message DeviceParameters {
  string name = 1;
  double max_volts = 2;
  double max_amps = 3;
  double min_volts = 4;
  double min_amps = 5;
}

// Enums
enum ControlMode {
  CONTROL_MODE_UNSPECIFIED = 0;
  CONTROL_MODE_VOLTAGE = 1;
  CONTROL_MODE_CURRENT = 2;
}
